<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Kafic4</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Kritičan CSS — sprječava "skok" sadržaja pri učitavanju stranice: hamburger i
       jezička ikona su odmah ispravno fiksirani u uglovima, bez čekanja na spoljni CSS fajl -->
  <style>
    .hamburger, .language-switcher { position: fixed !important; top: 15px !important; z-index: 1000 !important; }
    .hamburger { left: 15px !important; display: none; }
    .language-switcher { right: 15px !important; }
    @media (max-width: 900px) { .hamburger { display: flex !important; } }
  </style>
  
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-EDDYKYZG4J"></script>
  <script>
     window.dataLayer = window.dataLayer || [];
     function gtag(){dataLayer.push(arguments);}
     gtag('js', new Date());
     gtag('config', 'G-EDDYKYZG4J');
  </script>
  
  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="index-styles.css?v=20260821g" />
</head>
<body>
  <div id="sidebarBackdrop"></div>

  <div class="app-shell">
    <!-- SIDEBAR — kategorije/podkategorije -->
    <aside class="sidebar" id="categoryTabs">
      <div class="loading">
        <i class="fas fa-spinner fa-spin"></i>
        <span>Loading categories...</span>
      </div>
    </aside>

    <!-- GLAVNI DIO -->
    <div class="main-area">
      <!-- HERO SECTION -->
      <div class="hero-section">
        <!-- Hamburger dugme (samo mobilni) — pozicionirano u istom hederu, bez duplikata -->
        <button class="hamburger hint" id="hamburgerBtn" aria-label="Otvori meni"><i class="fas fa-bars"></i></button>

        <!-- DUGMAD ZA JEZIKE -->
        <div class="language-switcher">
          <div class="lang-inline" id="langOptions">
            <button class="language-btn active" data-lang="sr" title="Srpski">RS</button>
            <button class="language-btn" data-lang="en" title="English">GB</button>
            <button class="language-btn" data-lang="de" title="Deutsch">DE</button>
          </div>
          <button class="lang-toggle" id="langToggle" aria-label="Izaberi jezik"><i class="fas fa-globe"></i></button>
        </div>

        <div class="hero-content">
          <!-- LOGO SECTION -->
          <div class="logo-container" id="logoContainer" style="display: none;">
            <img id="siteLogo" alt="Logo" class="site-logo" />
          </div>
          
          <!-- DYNAMIC TITLE AND SUBTITLE - WITH LOADING STATE -->
          <div class="hero-loading">
            <i class="fas fa-spinner fa-spin"></i>
            <span>Loading...</span>
          </div>
          <h1 id="heroTitle" style="display: none;"></h1>
          <p id="heroSubtitle" style="display: none;"></p>
        </div>
      </div>

      <!-- SADRŽAJ IZABRANE KATEGORIJE -->
      <div class="content-grid" id="tabContent">
        <div class="loading">
          <i class="fas fa-spinner fa-spin"></i>
          <h3>Loading menu...</h3>
          <p>Please wait a moment</p>
        </div>
      </div>
    </div>
  </div>

  <!-- SCROLL TO TOP BUTTON -->
  <button class="scroll-to-top" id="scrollToTop" aria-label="Back to top">
    <i class="fas fa-chevron-up"></i>
  </button>
  
  <!-- FOOTER SECTION -->
  <footer class="site-footer" id="siteFooter" style="display: none;">
    <div class="footer-content">
      <div class="footer-text" id="footerText"></div>
      <div class="footer-links">
        <a href="#" id="instagramLink" class="social-link" target="_blank" rel="noopener" style="display: none;">
          <i class="fab fa-instagram"></i>
          <span>Instagram</span>
        </a>
        <a href="#" id="facebookLink" class="social-link" target="_blank" rel="noopener" style="display: none;">
          <i class="fab fa-facebook"></i>
          <span>Facebook</span>
        </a>
        <a href="#" id="youtubeLink" class="social-link" target="_blank" rel="noopener" style="display: none;">
          <i class="fab fa-youtube"></i>
          <span>YouTube</span>
        </a>
        <a href="#" id="twitterLink" class="social-link" target="_blank" rel="noopener" style="display: none;">
          <i class="fab fa-x"></i>
          <span>X</span>
        </a>
        <a href="#" id="tiktokLink" class="social-link" target="_blank" rel="noopener" style="display: none;">
          <i class="fab fa-tiktok"></i>
          <span>TikTok</span>
        </a>
      </div>
    </div>
  </footer>

  <script>
  // Hamburger meni (fioka sa strane) — samo na mobilnom
  (function () {
    function init() {
      const btn = document.getElementById('hamburgerBtn');
      const sidebar = document.getElementById('categoryTabs');
      const backdrop = document.getElementById('sidebarBackdrop');
      if (!btn || !sidebar || !backdrop) return;

      const closeDrawer = () => { sidebar.classList.remove('open'); backdrop.classList.remove('show'); };
      const openDrawer  = () => { sidebar.classList.add('open'); backdrop.classList.add('show'); };
      const stopHint    = () => btn.classList.remove('hint');

      btn.addEventListener('click', () => {
        stopHint();
        sidebar.classList.contains('open') ? closeDrawer() : openDrawer();
      });
      backdrop.addEventListener('click', closeDrawer);
      window._closeMobileDrawer = closeDrawer;

      // Animacija se sama ugasi nakon nekog vremena ako je niko ne primijeti/klikne
      setTimeout(stopHint, 9000);
    }
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
    else init();
  })();

  // Jezici — traka se otvara ulijevo od ikone, klikom na ikonu ili van trake se zatvara
  (function () {
    function init() {
      const toggle = document.getElementById('langToggle');
      const bar = document.getElementById('langOptions');
      if (!toggle || !bar) return;

      const closeBar = () => bar.classList.remove('show');
      const openBar  = () => bar.classList.add('show');

      toggle.addEventListener('click', (e) => {
        e.stopPropagation();
        bar.classList.contains('show') ? closeBar() : openBar();
      });
      document.addEventListener('click', (e) => {
        if (!bar.contains(e.target) && e.target !== toggle) closeBar();
      });
      // Zatvori nakon izbora jezika
      bar.querySelectorAll('.language-btn').forEach(b => {
        b.addEventListener('click', closeBar);
      });
    }
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
    else init();
  })();
  </script>

  <!-- Translation Manager MORA biti prije index-script.js -->
  <script src="index-translation-manager.js?v=20260821g"></script>
  <script type="module" src="index-script.js?v=20260821g"></script>
</body>
</html>
