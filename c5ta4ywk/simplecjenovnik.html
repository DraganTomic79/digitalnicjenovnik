<!DOCTYPE html>
<html lang="bs">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Cjenovnik</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800;900&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{
  --bg:#1c1c1c;--beige:#f2ede4;
  --gold:#C6A664;--gold2:#9E8344;
  --muted:#8f887a;--line:rgba(242,237,228,.15);
  --PW:794px;--PH:1123px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Poppins',Arial,sans-serif;background:#0c0c0c;color:var(--beige);-webkit-font-smoothing:antialiased}

#topbar{display:none;position:sticky;top:0;z-index:300;background:linear-gradient(135deg,#202020,#141414);border-bottom:2px solid var(--gold);padding:8px 20px;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.tb-btns{display:flex;gap:8px;margin-left:auto}
.tb-label{font-family:'Playfair Display',serif;font-size:.8rem;font-weight:700;color:var(--gold);letter-spacing:2px}
.btn-pdf{display:flex;align-items:center;gap:6px;background:linear-gradient(135deg,var(--gold),var(--gold2));color:#1a1a1a;border:none;padding:9px 16px;border-radius:7px;font-size:.8rem;font-weight:800;cursor:pointer;white-space:nowrap;transition:filter .2s,transform .2s;flex-shrink:0}
.btn-pdf:hover{filter:brightness(1.1);transform:translateY(-1px)}
.btn-pdf.busy{opacity:.6;pointer-events:none}
.btn-pdf.secondary{background:#242424;color:var(--gold);border:1.5px solid var(--gold)}

#loading{min-height:70vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:var(--muted)}
#loading i{font-size:2.4rem;color:var(--gold);animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* Prikaz bez cijena */
.hide-prices .row-price{display:none}
.hide-prices .row{grid-template-columns:1fr auto}

/* Modal — izbor sa/bez cijena */
#priceModal{display:flex;position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:9999;align-items:center;justify-content:center}
#priceModal .pm-box{background:#1e1e2e;border:2px solid var(--gold);border-radius:14px;padding:32px 28px;max-width:320px;width:90%;text-align:center;box-shadow:0 8px 40px rgba(0,0,0,.6)}
#priceModal h3{color:var(--gold);font-size:1.1rem;font-weight:800;margin-bottom:8px;font-family:'Playfair Display',serif}
#priceModal p{color:var(--muted);font-size:.85rem;margin-bottom:24px}
.pm-btn{display:block;width:100%;font-weight:800;padding:12px;border-radius:8px;border:none;cursor:pointer;font-size:.9rem;margin-bottom:10px}
.pm-btn-yes{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#1a1a1a}
.pm-btn-no{background:#2a2a3e;color:var(--gold);border:2px solid var(--gold)!important}

#book{display:none;flex-direction:column;align-items:center;gap:24px;padding:24px 12px 60px}

.pg{
  width:var(--PW);height:var(--PH);overflow:hidden;
  background:var(--bg);display:flex;flex-direction:column;
  box-shadow:0 6px 36px rgba(0,0,0,.7);position:relative;flex-shrink:0;
}

/* HEADER — samo logo */
.ph{flex-shrink:0;min-height:64px;display:flex;align-items:center;justify-content:center;padding:12px 40px;position:relative}
.ph::after{content:'';position:absolute;left:40px;right:40px;bottom:0;height:1px;background:var(--gold);opacity:.4}
.ph-logo{max-height:48px;max-width:190px;object-fit:contain;display:block}

/* TIJELO — cijela stranica u 2 kolone */
.pb{flex:1;padding:20px 40px 14px;display:grid;grid-template-columns:1fr 1fr;column-gap:34px;overflow:hidden;min-height:0;position:relative}
.lbl-main-full{grid-column:1/-1;text-align:center;font-family:'Playfair Display',serif;font-weight:800;font-size:1.35rem;letter-spacing:.3px;color:var(--gold);margin-bottom:4px}
.pcol{display:flex;flex-direction:column;gap:12px;min-width:0}

.pf{flex-shrink:0;height:30px;border-top:1px solid rgba(198,166,100,.25);display:flex;align-items:center;justify-content:space-between;padding:0 40px}
.pf-num{font-size:.58rem;color:var(--muted);white-space:nowrap}
.pf-num b{color:var(--gold)}
.pf-url{font-size:.54rem;color:var(--muted);white-space:nowrap;letter-spacing:.5px}

/* KATEGORIJE */
.cat-block{display:flex;flex-direction:column;gap:5px;flex-shrink:0}
.lbl-sub{flex-shrink:0;font-size:.82rem;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--gold);opacity:.85}

.divider{flex-shrink:0;display:flex;align-items:center;gap:8px;color:var(--gold);opacity:.5;margin:2px 0}
.divider.full-row{grid-column:1/-1}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--line)}
.divider i{font-size:.6rem}

.row-wrap{padding:2px 0}
.row{display:grid;grid-template-columns:1fr auto 3.4em;column-gap:10px;align-items:baseline}
.row-name{font-family:'Poppins',sans-serif;font-weight:600;font-size:.62rem;color:var(--beige);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-unit{font-style:italic;font-size:.6rem;color:var(--muted);white-space:nowrap}
.row-price{font-family:'Playfair Display',serif;font-weight:700;color:var(--gold);font-size:.72rem;white-space:nowrap;text-align:right}
.row-price-cur{font-weight:400;color:var(--muted);font-size:.85em;margin-right:2px}
.row-price-num{font-weight:800}
.row-desc{font-size:.58rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;line-height:1.3}

@media(max-width:830px){
  .pg{width:100%;height:auto;overflow:visible}
  #book{padding:12px 8px 40px;gap:16px}
  .ph,.pf{padding-left:20px;padding-right:20px}
  .pb{padding-left:20px;padding-right:20px;overflow:visible;grid-template-columns:1fr;row-gap:20px}
}
@media print{
  *{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important}
  body{background:var(--bg)}
  #topbar{display:none!important}
  #book{padding:0;gap:0}
  .pg{box-shadow:none;page-break-after:always;break-after:page}
}
</style>
</head>
<body>

<!-- Modal — izbor sa/bez cijena, prikazuje se odmah pri otvaranju -->
<div id="priceModal">
  <div class="pm-box">
    <h3><i class="fas fa-receipt"></i> Cjenovnik</h3>
    <p>Kako želiš prikazati cjenovnik?</p>
    <button class="pm-btn pm-btn-yes" onclick="initCijene(1)"><i class="fas fa-tag"></i> Sa cijenama</button>
    <button class="pm-btn pm-btn-no" onclick="initCijene(0)"><i class="fas fa-eye-slash"></i> Bez cijena</button>
  </div>
</div>

<script>
// Prikaz sa/bez cijena — čita ?cijene=1 ili ?cijene=0 iz URL-a; ako nije zadano, prikazuje modal
let _showPrices=null;
function initCijene(val){
  _showPrices=val;
  const modal=document.getElementById('priceModal');
  const book=document.getElementById('book');
  if(modal)modal.style.display='none';
  if(book){
    if(!val)book.classList.add('hide-prices');
    else book.classList.remove('hide-prices');
  }
  window._pdfNameSuffix=val?'':'-bezcijena';
}
function _initCijeneFromUrl(){
  const p=new URLSearchParams(window.location.search).get('cijene');
  if(p!==null)initCijene(parseInt(p));
}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',_initCijeneFromUrl);
else _initCijeneFromUrl();
</script>

<div id="topbar">
  <span class="tb-label">Cjenovnik</span>
  <div class="tb-btns">
    <button class="btn-pdf" id="btnPdfA4" onclick="window._pdfStart&&window._pdfStart('A4')">
      <i class="fas fa-download"></i> PDF A4
    </button>
    <button class="btn-pdf secondary" id="btnPdfA5" onclick="window._pdfStart&&window._pdfStart('A5')">
      <i class="fas fa-download"></i> PDF A5
    </button>
  </div>
</div>

<div id="loading"><i class="fas fa-spinner"></i><p>Učitavanje cjenovnika…</p></div>
<div id="book"></div>

<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.1/firebase-app.js";
import{getFirestore,collection,getDocs,query,orderBy}from"https://www.gstatic.com/firebasejs/10.12.1/firebase-firestore.js";

const QR_URL="https://digitalnicjenovnik.com/c5ta4ywk";

/* ── IZGRADNJA STRANICA — umjesto predviđanja visina, gradimo red po red
   DIREKTNO u pravom DOM-u i nakon svakog dodavanja STVARNO mjerimo da li
   stane (scrollHeight vs raspoloživa visina). Ako ne stane, red se uklanja
   i pokušava u sledećoj koloni / na sledećoj stranici. Ovo garantuje da
   nikad neće doći do preklapanja sa footerom, bez obzira na font, dužinu
   opisa ili naziva kategorije — jer se ne pretpostavlja ništa, samo mjeri. */
const PW=794, PH=1123;

let gLogo='',gCur='KM',gNum=0;
let book, curPb, curCol1, curCol2, activeCol, curPf, pagesEls=[];

function rowHTML(item){
  const has=(item.cijena!==undefined&&item.cijena!=='');
  const price=has?`${gCur?`<span class="row-price-cur">${gCur}</span>`:''}<span class="row-price-num">${parseFloat(item.cijena).toFixed(2)}</span>`:'';
  const unit=item.jedinicaMjere?esc(item.jedinicaMjere):'';
  return `<div class="row-wrap">
    <div class="row"><span class="row-name">${esc(item.naziv)}</span><span class="row-unit">${unit}</span><span class="row-price">${price}</span></div>
    ${item.opis?`<div class="row-desc">${esc(item.opis)}</div>`:''}
    ${item.opis2?`<div class="row-desc">${esc(item.opis2)}</div>`:''}
  </div>`;
}
function elFromHTML(html){ const d=document.createElement('div'); d.innerHTML=html; return d.firstElementChild; }

function newPage(titleLabel,showDivider){
  gNum++;
  const pg=document.createElement('div');pg.className='pg';
  /* Forsiraj desktop dimenzije za vrijeme izgradnje/mjerenja — bez obzira na
     stvarnu širinu ekrana, da mobilni CSS ne poremeti proračun prelamanja. */
  pg.style.width=PW+'px';pg.style.height=PH+'px';

  const hd=document.createElement('div');hd.className='ph';
  if(gLogo)hd.innerHTML=`<img src="${esc(gLogo)}" class="ph-logo" alt=""/>`;
  pg.appendChild(hd);

  const pb=document.createElement('div');pb.className='pb';
  pb.style.gridTemplateColumns='1fr 1fr';
  if(showDivider)pb.appendChild(elFromHTML(`<div class="divider full-row"><i class="fas fa-gem"></i></div>`));
  if(titleLabel)pb.appendChild(elFromHTML(`<div class="lbl-main-full">${esc(titleLabel)}</div>`));
  const c1=document.createElement('div');c1.className='pcol';
  const c2=document.createElement('div');c2.className='pcol';
  pb.appendChild(c1);pb.appendChild(c2);
  pg.appendChild(pb);

  const pf=document.createElement('div');pf.className='pf';
  pf.innerHTML=`<span class="pf-num">Stranica <b>${gNum}</b> / <b>__TOTAL__</b></span><span class="pf-url">${esc(QR_URL.replace('https://',''))}</span>`;
  pg.appendChild(pf);

  book.appendChild(pg);
  curPb=pb;curCol1=c1;curCol2=c2;activeCol=c1;curPf=pf;
  pagesEls.push(pg);
}

function fits(){ return activeCol.scrollHeight<=curPb.clientHeight+0.5; }

function placeSubBlock(label,items){
  let idx=0,first=true;
  while(idx<items.length){
    const headerText=first?label:`${label} (nastavak)`;
    const block=document.createElement('div');block.className='cat-block';
    const hdr=elFromHTML(`<div class="lbl-sub">${esc(headerText)}</div>`);
    block.appendChild(hdr);
    activeCol.appendChild(block);
    if(!fits()){
      activeCol.removeChild(block);
      if(activeCol===curCol1){activeCol=curCol2;}
      else{newPage(null,false);}
      continue; // pokušaj ponovo u novoj koloni/stranici
    }
    let addedAny=false;
    while(idx<items.length){
      const rowEl=elFromHTML(rowHTML(items[idx]));
      block.appendChild(rowEl);
      if(fits()){idx++;addedAny=true;first=false;}
      else{block.removeChild(rowEl);break;}
    }
    if(!addedAny){
      activeCol.removeChild(block);
      if(activeCol===curCol1){activeCol=curCol2;}
      else{newPage(null,false);}
      continue;
    }
    if(idx<items.length){
      if(activeCol===curCol1){activeCol=curCol2;}
      else{newPage(null,false);}
    }
  }
}

function buildPages(blocks){
  pagesEls=[];gNum=0;
  let firstMainSeen=false;
  for(const b of blocks){
    if(b.type==='main'){
      const divider=firstMainSeen;firstMainSeen=true;
      newPage(b.label,divider);
      continue;
    }
    placeSubBlock(b.label,b.items);
  }
  // upiši stvarni ukupan broj stranica u svaki footer
  const total=pagesEls.length;
  pagesEls.forEach(pg=>{
    const b=pg.querySelector('.pf-num b:last-child');
    if(b)b.textContent=String(total);
  });
}

/* ── FIREBASE ── */
const db=getFirestore(initializeApp({
  apiKey: "AIzaSyDkdX8R51_tM5KBgSBWvDEGkzW65F-jo8w",
  authDomain: "digitalnicjenovnik-kafic3.firebaseapp.com",
  projectId: "digitalnicjenovnik-kafic3",
  storageBucket: "digitalnicjenovnik-kafic3.firebasestorage.app",
  messagingSenderId: "848812318853",
  appId: "1:848812318853:web:573e474a946c2a8be189ec"
}));

async function loadCol(name){
  try{const s=await getDocs(query(collection(db,name),orderBy("sortOrder","asc")));
    return s.docs.map(d=>({id:d.id,...d.data(),sortOrder:d.data().sortOrder||999}));}
  catch{try{const s=await getDocs(collection(db,name));
    return s.docs.map(d=>({id:d.id,...d.data(),sortOrder:d.data().sortOrder||999}));}
    catch{return[];}}
}

const esc=s=>String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const srt=a=>[...a].sort((x,y)=>(x.sortOrder||999)-(y.sortOrder||999));

/* ── BUILD BLOCKS (ista logika kao katalog.html) ── */
function buildBlocks(gk,kat,pod,items){
  const active=items.filter(i=>i.aktivna!==false);
  const getI=name=>srt(active.filter(i=>i.podkategorija===name||i.kategorija===name));
  const B=[];
  if(gk.length){
    for(const g of srt(gk)){
      let added=false;
      for(const k of srt(kat.filter(k=>k.glavnaKategorijaId===g.id))){
        const pods=srt(pod.filter(p=>p.kategorijaId===k.id));
        if(pods.length){
          for(const p of pods){
            const its=getI(p.naziv);if(!its.length)continue;
            if(!added){B.push({type:'main',label:g.naziv});added=true;}
            B.push({type:'sub',label:`${k.naziv} – ${p.naziv}`,items:its});
          }
        }else{
          const its=getI(k.naziv);if(!its.length)continue;
          if(!added){B.push({type:'main',label:g.naziv});added=true;}
          B.push({type:'sub',label:k.naziv,items:its});
        }
      }
      const di=getI(g.naziv);
      if(di.length){if(!added){B.push({type:'main',label:g.naziv});added=true;}B.push({type:'sub',label:g.naziv,items:di});}
    }
  }else if(kat.length){
    for(const k of srt(kat)){
      let added=false;
      for(const p of srt(pod.filter(p=>p.kategorijaId===k.id))){
        const its=getI(p.naziv);if(!its.length)continue;
        if(!added){B.push({type:'main',label:k.naziv});added=true;}
        B.push({type:'sub',label:p.naziv,items:its});
      }
      const di=getI(k.naziv);
      if(di.length){if(!added)B.push({type:'main',label:k.naziv});B.push({type:'sub',label:k.naziv,items:di});}
    }
  }else if(active.length){B.push({type:'main',label:'Ponuda'});B.push({type:'sub',label:'Svi artikli',items:active});}
  return B;
}

/* ── PACKING + RENDER: vidi buildPages()/newPage()/placeSubBlock() iznad ── */

/* ── MAIN ── */
async function build(){
  try{
    const[pSnap,gk,kat,pod,meni]=await Promise.all([
      getDocs(collection(db,"web-postavke")),
      loadCol("glavne-kategorije"),loadCol("kategorije"),loadCol("podkategorije"),loadCol("meni")
    ]);
    pSnap.forEach(d=>{const x=d.data();gLogo=x.logoURL||'';gCur=x.currencyCode||'KM';});

    const blocks=buildBlocks(gk,kat,pod,meni);
    if(document.fonts&&document.fonts.ready){try{await document.fonts.ready;}catch{}}

    book=document.getElementById('book');
    book.innerHTML='';
    /* Gradimo van vidljivog toka (ali SA layout-om, ne display:none) da bismo
       mogli stvarno mjeriti visine dok gradimo — bez ovoga bi sve mjere bile 0. */
    book.style.cssText='display:flex;position:fixed;left:0;top:-99999px;visibility:hidden;';

    buildPages(blocks);
    if(pagesEls.length===0)newPage(null,false);

    /* Sad je izgrađeno i tačno izmjereno — skini forsirane desktop dimenzije
       da mobilni CSS može preuzeti za sam prikaz (raspodjela sadržaja po
       stranicama je već tačno odlučena mjerenjem, ovo mijenja samo izgled). */
    pagesEls.forEach(pg=>{
      pg.style.removeProperty('width');
      pg.style.removeProperty('height');
      const pbEl=pg.querySelector('.pb');
      if(pbEl)pbEl.style.removeProperty('grid-template-columns');
    });

    /* Sad je izgrađeno i tačno izmjereno — vrati na normalan (vidljiv) prikaz */
    book.style.cssText='display:flex;';

    document.getElementById('loading').style.display='none';
    document.getElementById('topbar').style.display='flex';
  }catch(err){
    console.error(err);
    document.getElementById('loading').innerHTML=`<div style="text-align:center;color:#8f887a;padding:20px"><i class="fas fa-exclamation-triangle" style="font-size:2rem;color:#f87171;display:block;margin-bottom:10px"></i><p>Greška: ${err.message}</p></div>`;
  }
}

/* ── PDF (A4 puna veličina, A5 = ista slika smanjena na A5 dimenzije) ── */
async function fetchDU(url){
  try{const r=await fetch(url,{mode:'cors',cache:'force-cache'});if(!r.ok)throw 0;
    const b=await r.blob();return await new Promise((rs,rj)=>{const fr=new FileReader();fr.onload=()=>rs(fr.result);fr.onerror=rj;fr.readAsDataURL(b);});}
  catch{return null;}
}

window._pdfStart=async function(format){
  const btnId=format==='A5'?'btnPdfA5':'btnPdfA4';
  const otherBtnId=format==='A5'?'btnPdfA4':'btnPdfA5';
  const btn=document.getElementById(btnId);
  const otherBtn=document.getElementById(otherBtnId);
  btn.classList.add('busy');otherBtn.classList.add('busy');
  const{jsPDF}=window.jspdf;
  const pgs=[...document.querySelectorAll('#book .pg')];
  const CW=794,CH=1123;
  const outW=format==='A5'?559:794, outH=format==='A5'?794:1123;

  const origHTML=btn.innerHTML;
  btn.innerHTML='<i class="fas fa-spinner fa-spin"></i> Učitavam slike…';
  const imgs=[...document.querySelectorAll('#book img')];
  const orig=new Map();
  await Promise.allSettled(imgs.map(async img=>{
    const src=img.src;if(!src||src.startsWith('data:')||src.startsWith('blob:'))return;
    orig.set(img,src);const d=await fetchDU(src);if(d)img.src=d;else img.style.visibility='hidden';
  }));

  document.getElementById('topbar').style.display='none';
  try{
    const pdf=new jsPDF({unit:'px',format:[outW,outH],orientation:'portrait',compress:true});
    for(let i=0;i<pgs.length;i++){
      btn.innerHTML=`<i class="fas fa-spinner fa-spin"></i> ${i+1}/${pgs.length}…`;
      await new Promise(r=>setTimeout(r,20));
      const c=await html2canvas(pgs[i],{
        scale:2,useCORS:false,allowTaint:false,backgroundColor:'#1c1c1c',
        width:CW,height:CH,windowWidth:1200,windowHeight:CH,scrollX:0,scrollY:0,
        logging:false,willReadFrequently:true,imageTimeout:0
      });
      if(i>0)pdf.addPage([outW,outH],'portrait');
      pdf.addImage(c.toDataURL('image/jpeg',.92),'JPEG',0,0,outW,outH,undefined,'FAST');
    }
    pdf.save(`Cjenovnik-c5ta4ywk${window._pdfNameSuffix||''}-${format}.pdf`);
  }catch(e){alert('PDF greška: '+e.message);}
  finally{
    orig.forEach((src,img)=>{img.src=src;img.style.visibility='';});
    document.getElementById('topbar').style.display='flex';
    btn.classList.remove('busy');otherBtn.classList.remove('busy');
    btn.innerHTML=origHTML;
  }
};

build();
</script>
</body>
</html>
