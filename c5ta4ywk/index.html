<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Kafic3</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-EDDYKYZG4J"></script>
  <script>
     window.dataLayer = window.dataLayer || [];
     function gtag(){dataLayer.push(arguments);}
     gtag('js', new Date());
     gtag('config', 'G-EDDYKYZG4J');
  </script>
  
  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="index-styles.css?v=20260910c" />

  <!-- Odmah primjenjuje POSLEDNJU SAČUVANU temu (boja/font/pozadina) iz browsera,
       prije nego što se stranica prikaže — sprječava "trepćanje" sa podrazumijevane
       na prilagođenu temu dok se čeka odgovor sa Firebase-a. Kad stigne svježi
       odgovor, index-script.js ponovo primjenjuje (i ažurira ovaj keš) za sledeći put. -->
  <script>
  (function () {
    try {
      var cached = localStorage.getItem('brandTheme_c5ta4ywk');
      if (!cached) return;
      var t = JSON.parse(cached);
      var root = document.documentElement.style;

      function hexToRgb(hex) {
        hex = hex.replace('#', '');
        return { r: parseInt(hex.substr(0, 2), 16), g: parseInt(hex.substr(2, 2), 16), b: parseInt(hex.substr(4, 2), 16) };
      }
      function shade(hex, percent) {
        var c = hexToRgb(hex);
        function adj(v) { var d = percent < 0 ? v : (255 - v); return Math.min(255, Math.max(0, Math.round(v + d * percent / 100))); }
        var r = adj(c.r), g = adj(c.g), b = adj(c.b);
        return '#' + [r, g, b].map(function (x) { return x.toString(16).padStart(2, '0'); }).join('');
      }

      if (t.brandColor && /^#[0-9A-Fa-f]{6}$/.test(t.brandColor)) {
        var hex = t.brandColor, rgb = hexToRgb(hex);
        root.setProperty('--gold-accent', hex);
        root.setProperty('--gold-accent-rgb', rgb.r + ', ' + rgb.g + ', ' + rgb.b);
        root.setProperty('--gold-dark', shade(hex, -22));
        root.setProperty('--gold-darker', shade(hex, -42));
        root.setProperty('--gold-medium-dark', shade(hex, -12));
        root.setProperty('--gold-light', shade(hex, 20));
        root.setProperty('--gold-lighter', shade(hex, 15));
        root.setProperty('--gold-pale', shade(hex, 55));
        root.setProperty('--gold-pale-lighter', shade(hex, 85));
        root.setProperty('--gold-text-price', shade(hex, -25));
        root.setProperty('--primary-color', hex);
        root.setProperty('--accent-color', shade(hex, -22));
        root.setProperty('--text-light', hex);
      }

      if (t.brandFont) {
        root.setProperty('--font-family-base', "'" + t.brandFont + "', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif");
        var linkId = 'brand-google-font-' + t.brandFont.replace(/\s+/g, '-').toLowerCase();
        if (!document.getElementById(linkId)) {
          var link = document.createElement('link');
          link.id = linkId; link.rel = 'stylesheet';
          link.href = 'https://fonts.googleapis.com/css2?family=' + encodeURIComponent(t.brandFont) + ':wght@400;600;700;800&display=swap';
          document.head.appendChild(link);
        }
      }

      if (t.backgroundColor && /^#[0-9A-Fa-f]{6}$/.test(t.backgroundColor)) {
        var bgHex = t.backgroundColor, bgRgb = hexToRgb(bgHex), isLight = t.backgroundMode === 'light';
        root.setProperty('--background-dark', bgHex);
        if (isLight) {
          root.setProperty('--bg-light', shade(bgHex, -6));
          root.setProperty('--text-color', '#2C2C2C');
          root.setProperty('--text-muted', '#5a5a5a');
          root.setProperty('--glass-bg', 'rgba(255, 255, 255, 0.85)');
          root.setProperty('--glass-bg-light', 'rgba(255, 255, 255, 0.7)');
        } else {
          root.setProperty('--bg-light', shade(bgHex, 12));
          root.setProperty('--text-color', '#F2E9D8');
          root.setProperty('--text-muted', '#E6D5B8');
          root.setProperty('--glass-bg', 'rgba(' + bgRgb.r + ', ' + bgRgb.g + ', ' + bgRgb.b + ', 0.85)');
          root.setProperty('--glass-bg-light', 'rgba(' + bgRgb.r + ', ' + bgRgb.g + ', ' + bgRgb.b + ', 0.75)');
        }
      }
    } catch (e) { /* tiho zanemari — koristi se podrazumijevana tema iz CSS-a */ }
  })();
  </script>
</head>
<body>
  <div class="container">
    <!-- HERO SECTION -->
    <div class="hero-section">
      <!-- DUGMAD ZA JEZIKE -->
      <div class="language-switcher">
        <div class="lang-inline" id="langOptions">
          <button class="language-btn active" data-lang="sr" title="Srpski">RS</button>
          <button class="language-btn" data-lang="en" title="English">GB</button>
          <button class="language-btn" data-lang="de" title="Deutsch">DE</button>
        </div>
        <button class="lang-toggle" id="langToggle" aria-label="Izaberi jezik"><i class="fas fa-globe"></i></button>
      </div>

      <div class="hero-content">
        <!-- LOGO SECTION -->
        <div class="logo-container" id="logoContainer" style="display: none;">
          <img id="siteLogo" alt="Logo" class="site-logo" />
        </div>
        
        <!-- DYNAMIC TITLE AND SUBTITLE - WITH LOADING STATE -->
        <div class="hero-loading">
          <i class="fas fa-spinner fa-spin"></i>
          <span>Loading...</span>
        </div>
        <h1 id="heroTitle" style="display: none;"></h1>
        <p id="heroSubtitle" style="display: none;"></p>
      </div>
    </div>
    
    <!-- CATEGORY TABS -->
    <div class="mobile-tabs" id="categoryTabs">
      <div class="loading">
        <i class="fas fa-spinner fa-spin"></i>
        <span>Loading categories...</span>
      </div>
    </div>
    
    <!-- TAB CONTENT -->
    <div class="tab-content" id="tabContent">
      <div class="loading">
        <i class="fas fa-spinner fa-spin"></i>
        <h3>Loading menu...</h3>
        <p>Please wait a moment</p>
      </div>
    </div>
  </div>

  <!-- SCROLL TO TOP BUTTON -->
  <button class="scroll-to-top" id="scrollToTop" aria-label="Back to top">
    <i class="fas fa-chevron-up"></i>
  </button>
  
  <!-- FOOTER SECTION -->
  <footer class="site-footer" id="siteFooter" style="display: none;">
    <div class="footer-content">
      <div class="footer-text" id="footerText"></div>
      <div class="footer-links">
        <a href="#" id="instagramLink" class="social-link" target="_blank" rel="noopener" style="display: none;">
          <i class="fab fa-instagram"></i>
          <span>Instagram</span>
        </a>
        <a href="#" id="facebookLink" class="social-link" target="_blank" rel="noopener" style="display: none;">
          <i class="fab fa-facebook"></i>
          <span>Facebook</span>
        </a>
        <a href="#" id="youtubeLink" class="social-link" target="_blank" rel="noopener" style="display: none;">
          <i class="fab fa-youtube"></i>
          <span>YouTube</span>
        </a>
        <a href="#" id="twitterLink" class="social-link" target="_blank" rel="noopener" style="display: none;">
          <i class="fab fa-x"></i>
          <span>X</span>
        </a>
        <a href="#" id="tiktokLink" class="social-link" target="_blank" rel="noopener" style="display: none;">
          <i class="fab fa-tiktok"></i>
          <span>TikTok</span>
        </a>
      </div>
    </div>
  </footer>

  <script>
  // Jezici — traka se otvara ulijevo od ikone, klikom na ikonu ili van trake se zatvara
  (function () {
    function init() {
      const toggle = document.getElementById('langToggle');
      const bar = document.getElementById('langOptions');
      if (!toggle || !bar) return;

      const closeBar = () => bar.classList.remove('show');
      const openBar  = () => bar.classList.add('show');

      toggle.addEventListener('click', (e) => {
        e.stopPropagation();
        bar.classList.contains('show') ? closeBar() : openBar();
      });
      document.addEventListener('click', (e) => {
        if (!bar.contains(e.target) && e.target !== toggle) closeBar();
      });
      bar.querySelectorAll('.language-btn').forEach(b => {
        b.addEventListener('click', closeBar);
      });
    }
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
    else init();
  })();
  </script>

  <!-- Translation Manager MORA biti prije index-script.js -->
  <script src="index-translation-manager.js?v=20260910c"></script>
  <script type="module" src="index-script.js?v=20260910c"></script>
</body>
</html>
